      - name: Regress managed native Execution Plane
        run: |
          python -m pip install -q uv
          cd _neko_upstream
          mapfile -t EXECUTION_NATIVE_TESTS < "$RUNNER_TEMP/execution-native-tests.txt"
          set +e
          uv run --locked --group dev python -m pytest -q \
            "${EXECUTION_NATIVE_TESTS[@]}" \
            --junitxml="$RUNNER_TEMP/execution-native-managed.xml"
          MANAGED_STATUS=$?
          set -e
          if [ "$MANAGED_STATUS" -gt 1 ]; then
            echo "Patched pytest infrastructure failed with exit $MANAGED_STATUS" >&2
            exit "$MANAGED_STATUS"
          fi
          test -s "$RUNNER_TEMP/execution-native-managed.xml"
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          tmp = Path(os.environ["RUNNER_TEMP"])
          baseline_path = tmp / "execution-native-baseline.xml"
          managed_path = tmp / "execution-native-managed.xml"

          def cases_and_failures(path):
              root = ET.parse(path).getroot()
              cases = set()
              failures = set()
              for case in root.iter("testcase"):
                  ident = f"{case.get('classname', '')}::{case.get('name', '')}"
                  cases.add(ident)
                  if case.find("failure") is not None or case.find("error") is not None:
                      failures.add(ident)
              return cases, failures

          baseline_cases, baseline_failures = cases_and_failures(baseline_path)
          managed_cases, managed_failures = cases_and_failures(managed_path)
          if baseline_cases != managed_cases:
              missing = sorted(baseline_cases - managed_cases)
              added = sorted(managed_cases - baseline_cases)
              raise SystemExit(
                  "BLOCK_EXECUTION_REGRESSION_TESTSET_DRIFT: "
                  f"missing={missing} added={added}"
              )
          introduced = sorted(managed_failures - baseline_failures)
          fixed = sorted(baseline_failures - managed_failures)
          print(
              "Execution paired native regression: "
              f"baseline_failures={len(baseline_failures)} "
              f"managed_failures={len(managed_failures)} "
              f"fixed={len(fixed)} introduced={len(introduced)}"
          )
          if fixed:
              print("Baseline failures fixed by managed patches:", *fixed, sep="\n  ")
          if introduced:
              print("BLOCK_EXECUTION_MANAGED_REGRESSION:", *introduced, sep="\n  ")
              raise SystemExit(1)
          PY

