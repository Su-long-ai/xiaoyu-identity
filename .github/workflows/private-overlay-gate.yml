name: XiaoYu private overlay gate

on:
  push:
    branches:
      - "private/neko-overlay-v1"
      - "agent/**"
  pull_request:
    branches:
      - "private/neko-overlay-v1"
  workflow_dispatch:
    inputs:
      soak_rounds:
        description: "Companion Runtime repeated-race soak rounds (1-50)"
        required: false
        default: "12"
        type: string

permissions:
  contents: read

concurrency:
  group: xiaoyu-private-overlay-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-architecture-gate:
    name: reuse-architecture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require product main current at agent commit boundary
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/') }}
        run: |
          git fetch --no-tags origin +refs/heads/private/neko-overlay-v1:refs/remotes/origin/private/neko-overlay-v1
          PRODUCT_MAIN_LATEST="$(git rev-parse refs/remotes/origin/private/neko-overlay-v1)"
          AGENT_COMMIT_TIME="$(git show -s --format=%cI HEAD)"
          PRODUCT_MAIN_REQUIRED="$(git rev-list --first-parent -1 --before="$AGENT_COMMIT_TIME" refs/remotes/origin/private/neko-overlay-v1)"
          if [ -z "$PRODUCT_MAIN_REQUIRED" ]; then
            echo "BLOCK_AGENT_STALE_BASE: cannot resolve product main at agent commit boundary"
            exit 6
          fi
          if ! git merge-base --is-ancestor "$PRODUCT_MAIN_REQUIRED" HEAD; then
            echo "BLOCK_AGENT_STALE_BASE: agent branch missed product main available before its HEAD ($PRODUCT_MAIN_REQUIRED)"
            echo "Sync origin/private/neko-overlay-v1 before continuing long-lived implementation."
            exit 6
          fi
          if git merge-base --is-ancestor "$PRODUCT_MAIN_LATEST" HEAD; then
            echo "PASS: agent branch contains current product main $PRODUCT_MAIN_LATEST"
          else
            echo "PASS_RACE: product main advanced after agent HEAD; this push is valid, next agent push must resync ($PRODUCT_MAIN_LATEST)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reuse-first hard gate
        run: python private_overlay/tools/check_reuse_first.py

      - name: Frozen architecture hard gate
        run: python private_overlay/tools/check_architecture_freeze.py

      - name: Repository-only plugin admission gate
        run: python private_overlay/tools/check_plugin_admission_repo.py

      - name: Overlay contract tests
        run: |
          python -m pip install -q "httpx[socks]>=0.28.1"
          python -m unittest -v \
            private_overlay.tests.test_overlay_contract \
            private_overlay.tests.test_reuse_first \
            private_overlay.tests.test_plugin_admission \
            private_overlay.tests.test_execution_plane_tool \
            private_overlay.tests.test_companion_runtime_soak \
            private_overlay.tests.test_probe_neko_runtime_health \
            private_overlay.tests.test_release_readiness \
            private_overlay.tests.test_ensure_private_plugin \
            private_overlay.tests.test_ensure_xiaoyu_activity_preferences \
            private_overlay.tests.test_reconcile_neko_plugin_runtime \
            private_overlay.tests.test_xiaoyu_interaction_policy_plugin \
            private_overlay.tests.test_native_embedding_assets

      - name: Compile overlay control plane
        run: |
          python -m compileall -q \
            private_overlay/tools \
            private_overlay/tests \
            private_overlay/migration \
            private_overlay/evals

      - name: Parse product PowerShell entrypoints
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem "private_overlay/tools" -Filter "*.ps1" -File | Sort-Object FullName)
          if ($scripts.Count -eq 0) {
            throw "No private_overlay PowerShell scripts were discovered."
          }
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error ("PowerShell parse failed: {0}" -f $script.FullName)
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host ("PASS: parsed {0} XiaoYu PowerShell product scripts" -f $scripts.Count)

      - name: Checkout pinned N.E.K.O runtime
        uses: actions/checkout@v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: c3fc33ff0d32e4a79fd905d1add22d45725071f5
          path: _neko_upstream
          fetch-depth: 1

      - name: Exercise patched companion switch/audio ownership regression
        run: |
          python -m pip install -q uv
          PRODUCT_WORKTREE="$RUNNER_TEMP/xiaoyu-neko-product-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_product_worktree() {
            git -C _neko_upstream worktree remove --force "$PRODUCT_WORKTREE" >/dev/null 2>&1 || true
          }
          trap cleanup_product_worktree EXIT
          git -C _neko_upstream worktree add --detach "$PRODUCT_WORKTREE" HEAD
          mapfile -t XIAOYU_PATCHES < <(python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); [print(item["file"]) for item in data["patches"]]' "$GITHUB_WORKSPACE/private_overlay/patches/series.json")
          if [ "${#XIAOYU_PATCHES[@]}" -eq 0 ]; then
            echo "managed patch series is empty" >&2
            exit 1
          fi
          for patch in "${XIAOYU_PATCHES[@]}"; do
            PATCH_PATH="$GITHUB_WORKSPACE/private_overlay/patches/$patch"
            test -f "$PATCH_PATH"
            git -C "$PRODUCT_WORKTREE" apply --check -- "$PATCH_PATH"
            git -C "$PRODUCT_WORKTREE" apply -- "$PATCH_PATH"
            git -C "$PRODUCT_WORKTREE" apply --reverse --check -- "$PATCH_PATH"
          done
          cd "$PRODUCT_WORKTREE"
          PYTHONPATH="$PRODUCT_WORKTREE" uv run --project "$GITHUB_WORKSPACE/_neko_upstream" --locked --group dev python -m pytest -q \
            tests/unit/test_character_switch_queue.py \
            tests/unit/test_character_runtime_voice_identity.py \
            tests/unit/test_model_switch_keeps_live_budget.py \
            tests/unit/test_audio_stream_queue.py::test_native_realtime_loud_ingress_publishes_activity_before_worker \
            tests/unit/test_realtime_close_ownership.py::test_teardown_outliving_its_connection_does_not_touch_the_replacement \
            tests/unit/test_realtime_close_ownership.py::test_retired_teardown_does_not_shut_the_replacements_arbiter_down \
            tests/unit/runtime/test_realtime_connection_recovery.py::test_retired_receive_loop_cannot_condemn_or_report_the_replacement \
            tests/unit/runtime/test_realtime_connection_recovery.py::test_late_failure_from_a_retired_generation_cannot_recover_the_successor \
            tests/unit/runtime/test_realtime_host_turn_identity.py::test_neither_hook_runs_once_the_host_is_on_a_new_turn \
            tests/unit/runtime/test_realtime_host_turn_identity.py::test_the_rotation_stands_down_when_a_turn_starts_during_response_done \
            tests/unit/test_tts_handoff_ownership.py::test_old_runtime_audio_waiting_for_frame_lock_is_not_sent \
            tests/unit/test_tts_handoff_ownership.py::test_runtime_handoff_drains_status_blocked_inside_websocket_send \
            tests/unit/test_voice_start_slot_ownership.py::test_a_superseded_flow_cannot_release_the_newer_starts_slot \
            tests/unit/test_voice_start_slot_ownership.py::test_the_automatic_restart_stands_down_at_every_resumption_point \
            tests/unit/test_cosyvoice_audio_done_generation.py \
            tests/unit/test_proactive_sid_guard.py \
            tests/unit/test_assistant_speech_finalize_static.py \
            tests/unit/test_openai_compatible_tts.py \
            tests/unit/test_qwen_intl_tts_routing.py \
            tests/unit/test_voice_management_tts.py \
            tests/unit/test_xiaoyu_startup_performance.py \
            tests/unit/test_xiaoyu_plugin_visible_final_admission.py \
            plugin/tests/unit/server/test_xiaoyu_push_origin.py \
            tests/unit/test_token_tracker_install_hooks_idempotent.py \
            tests/unit/test_cloudsave_lifecycle_flow.py \
            tests/unit/test_live2d_model_config_write_locking.py
          node --test \
            tests/frontend/chat_avatar_integration.test.cjs \
            tests/frontend/live2d_audio_ownership.test.cjs \
            tests/frontend/assistant-audio-lifecycle.test.cjs \
            tests/frontend/voice_recovery_races.cjs \
            tests/frontend/voice_preview_races.cjs

          SOAK_ROUNDS=3
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOAK_ROUNDS="${{ inputs.soak_rounds }}"
          fi
          if ! [[ "$SOAK_ROUNDS" =~ ^[0-9]+$ ]] || [ "$SOAK_ROUNDS" -lt 1 ] || [ "$SOAK_ROUNDS" -gt 50 ]; then
            echo "BLOCK_INVALID_SOAK_ROUNDS: expected integer 1..50, got '$SOAK_ROUNDS'" >&2
            exit 7
          fi
          for round in $(seq 1 "$SOAK_ROUNDS"); do
            echo "::group::Companion Runtime soak round $round/$SOAK_ROUNDS"
            PYTHONPATH="$PRODUCT_WORKTREE" uv run --project "$GITHUB_WORKSPACE/_neko_upstream" --locked --group dev python -m pytest -q \
              tests/unit/test_character_switch_queue.py \
              tests/unit/test_character_runtime_voice_identity.py \
              tests/unit/test_model_switch_keeps_live_budget.py \
              tests/unit/test_audio_stream_queue.py::test_native_realtime_loud_ingress_publishes_activity_before_worker \
              tests/unit/test_realtime_close_ownership.py::test_teardown_outliving_its_connection_does_not_touch_the_replacement \
              tests/unit/runtime/test_realtime_connection_recovery.py::test_retired_receive_loop_cannot_condemn_or_report_the_replacement \
              tests/unit/runtime/test_realtime_host_turn_identity.py::test_the_rotation_stands_down_when_a_turn_starts_during_response_done \
              tests/unit/test_tts_handoff_ownership.py::test_old_runtime_audio_waiting_for_frame_lock_is_not_sent \
              tests/unit/test_cosyvoice_audio_done_generation.py \
              tests/unit/test_proactive_sid_guard.py \
              tests/unit/test_xiaoyu_plugin_visible_final_admission.py \
              plugin/tests/unit/server/test_xiaoyu_push_origin.py
            node --test \
              tests/frontend/live2d_audio_ownership.test.cjs \
              tests/frontend/assistant-audio-lifecycle.test.cjs \
              tests/frontend/voice_recovery_races.cjs
            echo "::endgroup::"
          done

      - name: Verify pinned native Execution Plane seams
        run: python private_overlay/tools/check_execution_plane.py --neko-root _neko_upstream --no-pytest

      - name: Exercise native Agent readiness product path
        run: |
          python -m pip install -q uv
          cd _neko_upstream
          uv run --locked --group dev python -m pytest -q \
            tests/unit/test_agent_runtime_intent.py::test_set_agent_enabled_writes_intent \
            tests/unit/test_agent_runtime_intent.py::test_capability_rejected_does_not_persist_true_intent \
            tests/unit/test_agent_runtime_intent.py::test_restore_skipped_when_master_intent_off \
            tests/unit/test_agent_runtime_intent.py::test_restore_proceeds_when_master_intent_on \
            tests/unit/test_agent_model_probe.py::test_availability_with_the_agent_model_not_configured_says_only_that \
            tests/unit/test_agent_model_probe.py::test_switching_the_keyboard_on_with_everything_in_place \
            tests/unit/test_agent_browser_lifecycle.py::test_enabling_with_the_agent_model_not_configured_is_refused \
            tests/unit/test_agent_browser_lifecycle.py::test_switching_the_master_switch_on_marks_both_pending_and_queues_a_probe \
            tests/unit/test_agent_browser_lifecycle.py::test_switching_the_master_switch_on_without_a_configured_model_probes_nothing \
            tests/unit/nekoclaw/test_console_routes.py::test_the_runtime_page_reads_dsh_and_its_plugins_and_sets_the_preference \
            tests/unit/nekoclaw/test_console_routes.py::test_the_permission_table_shows_each_category_and_what_auto_comes_to \
            tests/unit/nekoclaw/test_console_routes.py::test_the_switches_and_the_browser_settings_are_those_the_agent_process_gives \
            plugin/tests/unit/server/test_console_proxy.py::test_a_switch_goes_to_the_main_server_as_the_command_it_is \
            plugin/tests/unit/server/test_console_proxy.py::test_a_switch_that_was_not_taken_is_told_as_such

      - name: Probe native host-restart commission continuity gap
        run: |
          python private_overlay/candidates/execution_plane/probe_host_restart_continuity_gap.py --neko-root _neko_upstream
          python -m pip install -q uv
          cd _neko_upstream
          uv run --locked --group dev python -m pytest -q \
            tests/unit/nekoclaw/test_host_ledger.py::test_unfinished_commissions_of_an_earlier_process_fail_on_open \
            tests/unit/nekoclaw/test_host_ledger.py::test_what_an_earlier_process_left_unfinished_is_reported_with_its_failure \
            tests/unit/nekoclaw/test_host_task_agents.py::test_an_answer_held_by_a_closing_session_survives_its_runtime_going_away \
            tests/unit/nekoclaw/test_host_task_agents.py::test_a_blocked_commission_is_taken_up_again_where_it_stopped \
            tests/unit/nekoclaw/test_host_task_agents.py::test_a_result_takes_up_again_a_parent_whose_idle_session_was_closed

      - name: Exercise native dsh optional-runtime product acceptance
        run: |
          python -m pip install -q uv
          cd _neko_upstream
          uv run --locked --group dev python -m pytest -q \
            tests/unit/nekoclaw/test_dsh_acp.py::test_a_request_that_gets_no_answer_times_out_and_a_late_answer_is_dropped \
            tests/unit/nekoclaw/test_dsh_acp.py::test_a_start_that_is_cancelled_ends_the_process_it_started \
            tests/unit/nekoclaw/test_dsh_driver.py::test_abort_stops_the_turn_and_drops_what_was_queued \
            tests/unit/nekoclaw/test_dsh_driver.py::test_a_session_resumes_in_a_new_process_without_being_told_again \
            tests/unit/nekoclaw/test_dsh_driver.py::test_a_dsh_whose_guard_did_not_load_is_not_used \
            tests/unit/nekoclaw/test_dsh_driver.py::test_dsh_can_be_made_ready_before_a_session_is_given_to_it \
            tests/unit/nekoclaw/test_dsh_driver.py::test_a_gateway_tool_is_ruled_on_by_the_host_before_the_call_is_made \
            tests/unit/nekoclaw/test_dsh_driver.py::test_the_hosts_tools_reach_dsh_as_a_service_and_keep_their_names_in_events \
            tests/unit/nekoclaw/test_dsh_driver.py::test_model_requests_go_to_each_sessions_own_model_and_report_its_usage \
            tests/unit/nekoclaw/test_dsh_grant_wire.py::test_pinned_dsh_native_denial_precedes_host_ask \
            tests/unit/nekoclaw/test_dsh_host_tools.py::test_each_dsh_process_has_a_token_of_its_own_that_ends_with_it \
            tests/unit/nekoclaw/test_dsh_host_tools.py::test_a_call_whose_token_is_revoked_while_its_body_comes_in_is_refused \
            tests/unit/nekoclaw/test_dsh_profile.py::test_nothing_is_uploaded \
            tests/unit/nekoclaw/test_dsh_profile.py::test_the_model_is_reached_only_through_the_drivers_endpoint \
            tests/unit/nekoclaw/test_dsh_profile.py::test_the_environment_is_the_hosts_without_what_would_configure_dsh \
            tests/unit/nekoclaw/test_dsh_install.py::test_another_version_on_the_disk_is_not_used \
            tests/unit/nekoclaw/test_dsh_install.py::test_an_install_that_is_cancelled_leaves_no_half_a_file \
            tests/unit/nekoclaw/test_host_runtimes.py::test_a_dsh_that_cannot_be_made_ready_leaves_the_commission_to_the_built_in_runtime \
            tests/unit/nekoclaw/test_host_runtimes.py::test_whatever_keeps_dsh_from_working_the_commission_is_still_done \
            tests/unit/nekoclaw/test_host_dsh_wiring.py::test_a_search_allowed_before_its_call_is_refused_when_the_settings_forbid_it_since \
            tests/unit/nekoclaw/test_console_routes.py::test_the_runtime_page_reads_dsh_and_its_plugins_and_sets_the_preference \
            tests/unit/nekoclaw/test_console_routes.py::test_installing_dsh_runs_behind_the_request_and_the_status_says_how_it_went \
            tests/unit/nekoclaw/test_dsh_forward.py::test_the_real_model_and_key_replace_dshs_and_the_rest_is_kept

      - name: Exercise native Execution Plane product E2E
        run: |
          python -m pip install -q uv
          cd _neko_upstream
          uv run --locked --group dev python -m pytest -q \
            tests/unit/nekoclaw/test_runtime_tools_fs.py::test_read_numbers_lines_and_reports_the_end \
            tests/unit/nekoclaw/test_runtime_tools_fs.py::test_write_creates_then_updates_and_keeps_the_existing_format \
            tests/unit/nekoclaw/test_runtime_shell_jobs.py::test_command_output_is_utf8_and_a_failure_carries_its_exit_code \
            tests/unit/nekoclaw/test_runtime_shell_jobs.py::test_a_cancelled_spawn_does_not_leave_a_process_behind \
            tests/unit/nekoclaw/test_runtime_shell_jobs.py::test_output_saved_before_a_restart_survives_the_next_long_command \
            tests/unit/nekoclaw/test_host_task_agents.py::test_commission_goes_to_a_task_agent_and_its_report_ends_it \
            tests/unit/nekoclaw/test_host_task_agents.py::test_blocked_and_failed_reports \
            tests/unit/nekoclaw/test_host_task_agents.py::test_stopping_closes_the_session_and_nothing_overwrites_cancelled \
            tests/unit/nekoclaw/test_host_task_agents.py::test_a_blocked_commission_is_taken_up_again_where_it_stopped \
            tests/unit/nekoclaw/test_host_task_agents.py::test_web_search_runs_the_search_plugin \
            tests/unit/nekoclaw/test_host_gateway.py::test_call_goes_through_the_same_runs_request_with_ctx \
            tests/unit/nekoclaw/test_host_gateway.py::test_each_mcp_server_is_asked_about_once_when_always_is_chosen \
            tests/unit/nekoclaw/test_host_gateway.py::test_declined_mcp_server_is_not_called \
            tests/unit/nekoclaw/test_host_gateway.py::test_registered_browser_is_discovered_called_and_released_through_the_gateway \
            tests/unit/nekoclaw/test_host_gateway.py::test_revoking_browser_approval_while_queued_keeps_the_next_provider_call_from_running \
            tests/unit/nekoclaw/test_host_gateway.py::test_stopping_a_commission_stops_a_builtin_call_under_way \
            tests/unit/nekoclaw/test_builtin_browser_tools.py::test_the_browser_is_started_by_the_first_call_and_kept_for_the_next \
            tests/unit/nekoclaw/test_builtin_browser_tools.py::test_a_click_that_was_not_carried_out_is_not_said_to_have_succeeded \
            tests/unit/nekoclaw/test_builtin_browser_tools.py::test_a_connection_that_is_gone_is_a_failed_outcome

          uv run --locked --group dev python - <<'PY'
          from nekoclaw.builtin.browser import launcher
          found = launcher.find_browsers()
          print("real browser candidates:", found)
          if not found:
              raise SystemExit("BLOCK_REAL_BROWSER_ACCEPTANCE: no supported browser found on runner")
          PY

          NEKO_TEST_REAL_BROWSER=1 uv run --locked --group dev python -m pytest -q \
            tests/unit/nekoclaw/test_builtin_browser_real.py::test_a_form_is_filled_in_sent_and_its_result_read \
            tests/unit/nekoclaw/test_builtin_browser_real.py::test_history_tabs_keys_and_an_embedded_document

      - name: Capture clean native Execution Plane regression baseline
        run: |
          python -m pip install -q uv
          cat > "$RUNNER_TEMP/execution-native-tests.txt" <<'EOF'
          tests/unit/nekoclaw/test_host_ledger.py
          tests/unit/nekoclaw/test_host_delivery.py
          tests/unit/nekoclaw/test_host_robustness.py
          tests/unit/nekoclaw/test_agent_wiring.py
          tests/unit/nekoclaw/test_host_plugin_runs.py
          tests/unit/nekoclaw/test_host_task_brain.py::test_failed_plugin_call_ends_failed_with_a_report
          tests/unit/nekoclaw/test_host_gateway.py::test_failed_run_is_an_error_result
          plugin/tests/unit/server/test_run_manager_idempotency.py
          tests/unit/test_role_placeholder_substitution.py::test_main_server_direct_reply_substitutes_master_name
          tests/test_agent_rewrite_regression.py
          EOF
          cd _neko_upstream
          mapfile -t EXECUTION_NATIVE_TESTS < "$RUNNER_TEMP/execution-native-tests.txt"
          set +e
          uv run --locked --group dev python -m pytest -q \
            "${EXECUTION_NATIVE_TESTS[@]}" \
            --junitxml="$RUNNER_TEMP/execution-native-baseline.xml"
          BASELINE_STATUS=$?
          set -e
          if [ "$BASELINE_STATUS" -gt 1 ]; then
            echo "Baseline pytest infrastructure failed with exit $BASELINE_STATUS" >&2
            exit "$BASELINE_STATUS"
          fi
          test -s "$RUNNER_TEMP/execution-native-baseline.xml"

      - name: Exercise managed effect-state patch on fresh native pin
        run: |
          git -C _neko_upstream apply --check "$GITHUB_WORKSPACE/private_overlay/patches/0011-execution-outbox-effect-state.patch"
          git -C _neko_upstream apply "$GITHUB_WORKSPACE/private_overlay/patches/0011-execution-outbox-effect-state.patch"
          python -m py_compile             _neko_upstream/nekoclaw/host/ledger.py             _neko_upstream/nekoclaw/host/outbox.py
          python private_overlay/tools/verify_execution_effect_state_candidate.py --neko-root _neko_upstream

      - name: Exercise managed native delivery receipt patch
        run: |
          git -C _neko_upstream apply --check "$GITHUB_WORKSPACE/private_overlay/patches/0012-native-delivery-receipt.patch"
          git -C _neko_upstream apply "$GITHUB_WORKSPACE/private_overlay/patches/0012-native-delivery-receipt.patch"
          python -m py_compile \
            _neko_upstream/main_logic/agent_event_bus.py \
            _neko_upstream/app/agent_server/api_runtime.py \
            _neko_upstream/app/agent_server/nekoclaw_mount.py \
            _neko_upstream/app/main_server/character_runtime.py
          python private_overlay/tools/verify_native_delivery_receipt_candidate.py --neko-root _neko_upstream

      - name: Exercise native delivery receipt real-ZMQ E2E
        run: |
          python -m pip install -q "pyzmq>=27.1.0" "orjson>=3.11.8"
          python private_overlay/tools/verify_native_delivery_receipt_zmq_e2e.py --neko-root _neko_upstream

      - name: Exercise managed plugin-run unknown-effect patch
        run: |
          git -C _neko_upstream apply --check "$GITHUB_WORKSPACE/private_overlay/patches/0013-plugin-run-unknown-effect.patch"
          git -C _neko_upstream apply "$GITHUB_WORKSPACE/private_overlay/patches/0013-plugin-run-unknown-effect.patch"
          python -m py_compile             _neko_upstream/nekoclaw/host/plugin_runs.py             _neko_upstream/nekoclaw/host/task_brain.py             _neko_upstream/nekoclaw/host/gateway.py
          cd _neko_upstream
