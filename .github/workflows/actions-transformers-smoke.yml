name: XiaoYu Actions Transformers Smoke Test

on:
  push:
    branches:
      - experiment/actions-transformers-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-transformers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Transformers from PyPI
        run: |
          python -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 2 transformers

      - name: Verify import and configuration
        run: |
          python - <<'PY'
          import sys
          import transformers
          from transformers import AutoConfig

          cfg = AutoConfig.for_model("bert")
          assert cfg.model_type == "bert"
          print("Python:", sys.version)
          print("Transformers:", transformers.__version__)
          print("AutoConfig smoke test: PASS")
          PY
