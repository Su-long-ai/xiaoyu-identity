name: XiaoYu implementation v1 contracts

on:
  pull_request:
    paths:
      - "xiaoyu/**"
      - "identity_core.py"
      - ".github/workflows/implementation-v1.yml"
  push:
    branches:
      - "feat/implementation-v1-*"
    paths:
      - "xiaoyu/**"
      - "identity_core.py"
      - ".github/workflows/implementation-v1.yml"

permissions:
  contents: read

jobs:
  implementation-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile XiaoYu package
        run: python -m compileall -q xiaoyu

      - name: Run R1-R8 and legacy identity regression
        run: |
          python -m unittest -v \
            xiaoyu.tests.test_architecture_imports \
            xiaoyu.tests.test_contracts \
            xiaoyu.tests.test_persistence_migrations \
            xiaoyu.tests.test_canonical_events \
            xiaoyu.tests.test_identity_shadow \
            xiaoyu.tests.test_authorization_policy \
            xiaoyu.tests.test_effect_outbox \
            test_identity \
            test_identity_v2
