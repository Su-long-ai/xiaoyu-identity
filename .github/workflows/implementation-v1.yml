name: XiaoYu implementation v1 contracts

on:
  pull_request:
    paths:
      - "xiaoyu/**"
      - "identity_core.py"
      - ".github/workflows/implementation-v1.yml"
  push:
    branches:
      - "feat/implementation-v1-*"
      - "fix/redteam-*"
    paths:
      - "xiaoyu/**"
      - "identity_core.py"
      - ".github/workflows/implementation-v1.yml"

permissions:
  contents: read

jobs:
  implementation-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile XiaoYu package
        run: python -m compileall -q xiaoyu

      - name: Discover all XiaoYu implementation tests
        run: python -m unittest discover -v -s xiaoyu/tests -p "test_*.py"

      - name: Run legacy identity regression
        run: python -m unittest -v test_identity test_identity_v2
