[plugin]
name = "XiaoYu Interaction Policy"
description = "Private XiaoYu semantic interaction-control adapter. Classifies proactive quiet/resume plus audible speech mute/unmute intent, delegates proactive state to N.E.K.O, and exposes only a private speech gate bit to the XiaoYu output boundary."
short_description = "Semantic proactive and audible-speech hard controls for XiaoYu."
keywords = ["xiaoyu", "quiet", "silence", "speech-mute", "proactive", "interaction-policy"]
version = "0.2.0"
id = "xiaoyu_interaction_policy"
type = "plugin"
entry = "plugin.plugins.xiaoyu_interaction_policy:XiaoYuInteractionPolicyPlugin"

[[plugin.dependency]]
id = "proactive_controller"
untested = ">=0"

[plugin.author]
name = "XiaoYu Private Overlay"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.store]
enabled = false

[plugin_runtime]
enabled = true
auto_start = false
