[plugin]
name = "XiaoYu Interaction Policy"
description = "Private XiaoYu interaction adapter. Adds semantic hard controls and a read-only ActivityWatch recent-activity bridge; hard execution remains delegated to N.E.K.O authorities."
short_description = "Hard interaction controls plus ActivityWatch-backed recent activity recall for XiaoYu."
keywords = ["xiaoyu", "quiet", "silence", "speech-mute", "privacy", "vision", "proactive", "interaction-policy"]
version = "0.6.0"
id = "xiaoyu_interaction_policy"
type = "plugin"
entry = "plugin.plugins.xiaoyu_interaction_policy:XiaoYuInteractionPolicyPlugin"

[[plugin.dependency]]
id = "proactive_controller"
untested = ">=0"

[plugin.author]
name = "XiaoYu Private Overlay"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.store]
enabled = false

[plugin_runtime]
enabled = true
auto_start = false
